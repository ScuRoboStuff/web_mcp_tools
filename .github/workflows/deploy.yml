name: deploy (auto release + deploy)

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: ["master"]

permissions:
  contents: write    # needed by semantic-release to create tags/releases and update changelog

jobs:

  release:
    name: Create Release (semantic-release)
    # Run only if the external CI workflow (tests) concluded successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.relout.outputs.published }}
      version: ${{ steps.relout.outputs.version }}
    steps:
      - name: Checkout commit from successful CI run
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Ensure we release the exact commit that passed CI
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preflight semantic-release config (CJS)
        run: node -e "require('./.releaserc.cjs'); console.log('semantic-release config OK')"

      - name: Get previous tag (if any)
        id: pretag
        run: |
          echo "tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Initialize Node project and install Semantic Release
        run: |
          npm init -y
          npm install -D \
            semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/changelog \
            @semantic-release/github \
            @semantic-release/git \
            --no-audit --no-fund --silent

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --config .releaserc.cjs

      - name: Get new tag (if published)
        id: posttag
        run: |
          echo "tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Determine release outputs
        id: relout
        run: |
          if [ "${{ steps.posttag.outputs.tag }}" != "${{ steps.pretag.outputs.tag }}" ] && [ -n "${{ steps.posttag.outputs.tag }}" ]; then
            echo "published=true" >> $GITHUB_OUTPUT
            # Strip leading 'v' from tag for version output consistency
            ver="${{ steps.posttag.outputs.tag }}"
            ver_nov=${ver#v}
            echo "version=${ver_nov}" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy CDK (tagged release)
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      AWS_ACCOUNT_ID:  ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_REGION: us-east-1
      TAG_NAME: v${{ needs.release.outputs.version }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node (for CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.GH_AWS_ROLE_ARN }}
          audience: sts.amazonaws.com

      - name: Install CDK Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r cdk/requirements.txt

      - name: (Optional) Install project deps for bundling
        run: |
          pip install -r requirements.txt

      - name: CDK Bootstrap (safe to re-run)
        run: cdk bootstrap aws://$AWS_ACCOUNT_ID/$AWS_REGION

      - name: CDK Deploy
        working-directory: cdk
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
          APP_VERSION: v${{ needs.release.outputs.version }}
        run: cdk deploy --app "python app.py" -c appVersion=$APP_VERSION --require-approval never
