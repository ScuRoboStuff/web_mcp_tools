name: deploy

on:
  push:
    branches: [ "master" ]

permissions:
  id-token: write   # required for GitHub OIDC to AWS
  contents: read

env:
  AWS_ACCOUNT_ID:  ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: us-east-1

jobs:
  cdk-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node (for CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      - name: Install jq (for debug step)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Debug OIDC token audience
        run: |
          set -euo pipefail
          echo "Requesting OIDC token..."
          # Request a token with the same audience you'll use for AWS
          TOKEN_JSON=$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          echo "Raw token response:"; echo "$TOKEN_JSON" | jq .
          TOKEN=$(echo "$TOKEN_JSON" | jq -r .value)
          echo "OIDC token payload:"
          echo "$TOKEN" | jq -R 'split(".")[1]
            | gsub("-"; "+")
            | gsub("_"; "/")
            | . + (["", "=", "==", "==="][(4 - (length % 4)) % 4])
            | @base64d
            | fromjson'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.GH_AWS_ROLE_ARN }}
          audience: sts.amazonaws.com

      - name: Install CDK Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r cdk/requirements.txt

      - name: (Optional) Install project deps for bundling
        run: |
          pip install -r requirements.txt

      - name: CDK Bootstrap (safe to re-run)
        run: cdk bootstrap aws://$AWS_ACCOUNT_ID/$AWS_REGION

      - name: CDK Deploy
        working-directory: cdk
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: cdk deploy --require-approval never
