name: deploy lambdfa

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: ["master"]

permissions:
  id-token: write   # required for GitHub OIDC to AWS
  contents: read

env:
  AWS_ACCOUNT_ID:  ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_REGION: us-east-1

jobs:
  cdk-deploy:
    # Only proceed if the triggering CI workflow concluded successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Deploy exactly the commit that passed CI
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node (for CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install CDK CLI
        run: npm install -g aws-cdk@2

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.GH_AWS_ROLE_ARN }}
          audience: sts.amazonaws.com

      - name: Install CDK Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r cdk/requirements.txt

      - name: (Optional) Install project deps for bundling
        run: |
          pip install -r requirements.txt

      - name: CDK Bootstrap (safe to re-run)
        run: cdk bootstrap aws://$AWS_ACCOUNT_ID/$AWS_REGION

      - name: CDK Deploy
        working-directory: cdk
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: cdk deploy --app "python app.py" --require-approval never
