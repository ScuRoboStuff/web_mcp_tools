name: tests

on:
  push:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq (for JSON validation)
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate JSON configs (no BOM, valid JSON)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .releaserc.json ]; then
            echo "Checking .releaserc.json for UTF-8 BOM and valid JSON..."
            # Print first 16 bytes for diagnostics
            echo "First 16 bytes (hex):"
            hexdump -v -e '16/1 "%02x " "\n"' -n 16 .releaserc.json || true

            # Robust BOM detection using hexdump (EF BB BF)
            bytes=$(hexdump -v -e '1/1 "%02x"' -n 3 .releaserc.json || true)
            if [ "$bytes" = "efbbbf" ]; then
              echo "Error: .releaserc.json contains a UTF-8 BOM (U+FEFF). Remove it." >&2
              exit 1
            fi

            # Validate JSON syntax
            jq -e . .releaserc.json >/dev/null
          fi

      - name: Lint commits (Conventional Commits)
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest -q
